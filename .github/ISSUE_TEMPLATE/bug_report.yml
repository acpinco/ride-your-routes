name: Bug report
description: Something in the app isn't working right
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Tap ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the app's settings or about screen.
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 15
  - type: input
    id: trainer
    attributes:
      label: Trainer and heart rate strap
      placeholder: Wahoo KICKR, Polar H10
  - type: textarea
    id: log
    attributes:
      label: Ride log (optional)
      description: If the bug happened during a ride, paste the output of "Share last ride log". Remove anything personal first.
      render: text
